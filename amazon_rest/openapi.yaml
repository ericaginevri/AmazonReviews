openapi: 3.0.3

info:
  title: Amazon Analytics API
  version: 1.0.0

servers:
  - url: http://localhost:8080/v1

paths:
  /hadoop:
    post:
      summary: Run Hadoop job
      operationId: run_hadoop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HadoopRequest'
      responses:
        '200':
          description: Hadoop job started
  /spark:
    post:
      summary: Run Spark job
      operationId: run_spark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SparkRequest'
      responses:
        '200':
          description: Spark job started
  /results/hadoop:
    get:
      summary: Get Hadoop results
      operationId: get_hadoop_results
      responses:
        '200':
          description: Hadoop results
  /results/spark:
    get:
      summary: Get Spark results
      operationId: get_spark_results
      responses:
        '200':
          description: Spark results
components:
  schemas:
    HadoopRequest:
      type: object
      properties:
        dataset:
          type: string
          example: amazon_reviews_250mb.tsv
        job1Reducers:
          type: integer
          example: 2
        job2Reducers:
          type: integer
          example: 2
        job3Reducers:
          type: integer
          example: 2
      required:
        - dataset
        - job1Reducers
        - job2Reducers
        - job3Reducers
    SparkRequest:
      type: object
      properties:
        dataset:
          type: string
          example: amazon_reviews_250mb.tsv
        job1Partitions:
          type: integer
          example: 4
        job2Partitions:
          type: integer
          example: 4
        job3Partitions:
          type: integer
          example: 4
      required:
        - dataset
        - job1Partitions
        - job2Partitions
        - job3Partitions